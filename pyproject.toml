[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attack-surface-council"
version = "0.1.0"
description = "Defensive multi-agent security hypothesis council."
requires-python = ">=3.10"
readme = "README.md"

[project.scripts]
attack-surface-council = "attack_surface.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
